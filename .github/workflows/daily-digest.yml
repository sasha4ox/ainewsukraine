name: Daily digest

on:
  schedule:
    # 20:07 Europe/Kyiv. GitHub cron is UTC and delays jobs that start at :00,
    # so the post goes out at :07. The script skips whichever slot is an hour off.
    # Summer (UTC+3): 17:07 UTC. Winter (UTC+2): 18:07 UTC.
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_FAST: ${{ vars.OPENAI_MODEL_FAST || 'gpt-4o-mini' }}
          OPENAI_MODEL_SMART: ${{ vars.OPENAI_MODEL_SMART || 'gpt-4o' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
          DIGEST_TIME: ${{ vars.DIGEST_TIME || '20:00' }}
          DIGEST_NEWS_COUNT: ${{ vars.DIGEST_NEWS_COUNT || '10' }}
          MIN_CREDIBILITY_SCORE: ${{ vars.MIN_CREDIBILITY_SCORE || '60' }}
          MIN_IMPORTANCE_SCORE: ${{ vars.MIN_IMPORTANCE_SCORE || '40' }}
          MAX_PER_CATEGORY: ${{ vars.MAX_PER_CATEGORY || '3' }}
          MAX_EVENTS_TO_SCORE: ${{ vars.MAX_EVENTS_TO_SCORE || '40' }}
          LOG_LEVEL: info
          TZ: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
