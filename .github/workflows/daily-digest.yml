name: Daily digest

on:
  schedule:
    # This repo's scheduled jobs start about 5 hours after the cron time.
    # 11:07, 13:07 and 15:07 UTC therefore tend to wake a runner around 20:00 Kyiv.
    # The first step waits out a short gap, or posts immediately if 20:00 has passed.
    - cron: "7 11,13,15 * * *"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
          DIGEST_TIME: ${{ vars.DIGEST_TIME || '20:00' }}
        run: node .github/scripts/wait-for-digest.mjs
      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - if: steps.gate.outputs.proceed == 'true'
        run: npm ci
      - if: steps.gate.outputs.proceed == 'true'
        run: npx prisma generate
      - if: steps.gate.outputs.proceed == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: steps.gate.outputs.proceed == 'true'
        run: npm run digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_FAST: ${{ vars.OPENAI_MODEL_FAST || 'gpt-4o-mini' }}
          OPENAI_MODEL_SMART: ${{ vars.OPENAI_MODEL_SMART || 'gpt-4o' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
          DIGEST_TIME: ${{ vars.DIGEST_TIME || '20:00' }}
          DIGEST_NEWS_COUNT: ${{ vars.DIGEST_NEWS_COUNT || '10' }}
          MIN_CREDIBILITY_SCORE: ${{ vars.MIN_CREDIBILITY_SCORE || '60' }}
          MIN_IMPORTANCE_SCORE: ${{ vars.MIN_IMPORTANCE_SCORE || '40' }}
          MAX_PER_CATEGORY: ${{ vars.MAX_PER_CATEGORY || '3' }}
          MAX_EVENTS_TO_SCORE: ${{ vars.MAX_EVENTS_TO_SCORE || '40' }}
          LOG_LEVEL: info
          TZ: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
