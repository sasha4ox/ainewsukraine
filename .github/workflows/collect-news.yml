name: Collect news

on:
  schedule:
    # 03:13, 09:13, 15:13 Kyiv in summer. The last slot is 19:37 Kyiv, half an hour before the 20:07 digest.
    # Summer (UTC+3): 16:37 UTC. Winter (UTC+2): 17:37 UTC.
    - cron: "13 0 * * *"
    - cron: "13 6 * * *"
    - cron: "13 12 * * *"
    - cron: "37 16 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_WEB_FALLBACK: ${{ vars.TELEGRAM_WEB_FALLBACK }}
          LOG_LEVEL: info
          TZ: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
